<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sorting Hat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

:root {
  --teal: #0d9488;
  --purple: #7c3aed;
  --gold: #f5b301;
  --pink: #ff7eb6;
  --ink: #2b2250;
  --bg1: #fff4fb;
  --bg2: #e8f7ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Fredoka', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px;
}
h1 { font-size: clamp(28px, 5vw, 48px); margin: 8px 0; text-align: center; }
h2 { font-size: clamp(22px, 3.5vw, 32px); margin: 6px 0; text-align: center; }
a { color: inherit; }

.topbar { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn {
  font: inherit; font-weight: 600; font-size: 18px; cursor: pointer;
  border: 0; border-radius: 999px; padding: 10px 22px;
  background: var(--purple); color: #fff;
  box-shadow: 0 5px 0 #4c1d95; transition: transform .08s, box-shadow .08s;
  text-decoration: none; display: inline-block;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4c1d95; }
.btn.teal { background: var(--teal); box-shadow: 0 5px 0 #0a6b63; }
.btn.teal:active { box-shadow: 0 1px 0 #0a6b63; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 #b88700; }
.btn.small { font-size: 15px; padding: 6px 16px; }

/* picture holder: shows an emoji until a real image is found */
.pic { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pic .emoji { line-height: 1; }

/* ---------- menu ---------- */
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; width: 100%; max-width: 900px; margin-top: 20px; }
.card {
  background: #fff; border-radius: 28px; padding: 22px; text-align: center;
  box-shadow: 0 8px 0 rgba(124,58,237,.18), 0 14px 30px rgba(0,0,0,.08);
  text-decoration: none; transition: transform .15s;
}
.card:hover { transform: translateY(-4px) rotate(-1deg); }
.card .pic { width: 150px; height: 150px; margin: 0 auto 10px; }
.card .pic .emoji { font-size: 90px; }
.card p { margin: 6px 0 0; font-size: 18px; opacity: .8; }
.subhead { text-align: center; font-size: 20px; opacity: .8; margin: 0; }

/* ---------- story picker ---------- */
.storylist { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 16px; width: 100%; max-width: 1000px; }
.storylist .card { width: 300px; }

/* ---------- adventure ---------- */
.stage { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 8px; }
.scene-pic {
  width: min(92vw, 52vh * 1.6, 640px); aspect-ratio: 16/10; background: #fff; border-radius: 32px;
  border: 6px solid #fff; box-shadow: 0 8px 0 rgba(13,148,136,.25), 0 14px 30px rgba(0,0,0,.1);
}
.scene-pic .emoji { font-size: clamp(80px, 18vw, 170px); letter-spacing: 8px; }
.scene-text {
  background: #fff; border-radius: 24px; padding: 16px 22px; max-width: 760px; width: 100%;
  font-size: clamp(18px, 2.2vw, 24px); line-height: 1.4; text-align: center;
  box-shadow: 0 5px 0 rgba(124,58,237,.15);
}
.choices { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: 100%; }
.choice {
  width: min(44vw, 300px); background: #fff; border: 0; border-radius: 30px; padding: 14px 10px 18px;
  cursor: pointer; font: inherit; color: var(--ink);
  box-shadow: 0 8px 0 var(--purple), 0 14px 26px rgba(0,0,0,.1);
  transition: transform .1s;
}
.choice:nth-child(2) { box-shadow: 0 8px 0 var(--teal), 0 14px 26px rgba(0,0,0,.1); }
.choice:hover { transform: translateY(-5px) scale(1.03); }
.choice:active { transform: translateY(5px); }
.choice .pic { width: 100%; aspect-ratio: 1; max-height: 220px; }
.choice .pic .emoji { font-size: clamp(60px, 11vw, 110px); }
.choice .word { font-size: clamp(34px, 6vw, 54px); font-weight: 700; letter-spacing: 3px; text-transform: lowercase; }
.the-end { font-size: clamp(30px, 6vw, 52px); font-weight: 700; color: var(--purple); }
.fade { animation: pop .45s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- sorter ---------- */
.board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px; }
.progress { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #d9d2f3; }
.dot.done { background: var(--teal); }
.dot.now { background: var(--gold); transform: scale(1.3); }
.buckets { display: flex; gap: 20px; width: 100%; justify-content: center; }
.bucket {
  flex: 1; max-width: 420px; background: #fff; border: 6px dashed #c9bdf0; border-radius: 34px;
  padding: 10px 10px 16px; text-align: center; cursor: pointer; font: inherit; color: var(--ink);
  transition: transform .12s, background .12s;
}
.bucket.a { border-color: #b7a1f5; }
.bucket.b { border-color: #7fd6cd; }
.bucket.hover { transform: scale(1.05); background: #fffbe0; }
.bucket .pic { width: min(36vw, 220px); height: min(36vw, 220px); margin: 0 auto; }
.bucket .pic .emoji { font-size: clamp(70px, 14vw, 130px); }
.bucket .label { font-size: clamp(32px, 6vw, 56px); font-weight: 700; }
.bucket .hint { font-size: 17px; opacity: .7; }
.bucket.munch { animation: munch .5s; }
@keyframes munch { 0%{transform:scale(1)} 30%{transform:scale(1.12,.9)} 60%{transform:scale(.95,1.08)} 100%{transform:scale(1)} }
.wordcard {
  touch-action: none; user-select: none; cursor: grab; position: relative; z-index: 10;
  background: #fff; border-radius: 28px; padding: 12px 36px 16px; text-align: center;
  box-shadow: 0 8px 0 var(--gold), 0 14px 26px rgba(0,0,0,.12);
}
.wordcard .pic { width: 120px; height: 120px; margin: 0 auto; }
.wordcard .pic .emoji { font-size: 70px; }
.wordcard .word { font-size: clamp(44px, 9vw, 84px); font-weight: 700; letter-spacing: 3px; }
.wordcard.dragging { cursor: grabbing; transition: none; box-shadow: 0 18px 30px rgba(0,0,0,.2); }
.wordcard.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(14px)} 60%{transform:translateX(-10px)} 80%{transform:translateX(10px)} }
.tip { font-size: 18px; opacity: .75; text-align: center; margin: 0; }
.stars { font-size: clamp(50px, 12vw, 100px); letter-spacing: 6px; }
.setlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; width: 100%; max-width: 900px; margin-top: 16px; }
.setlist .card { padding: 16px; }
.setlist .card .pic { width: 110px; height: 110px; }
.setlist .card .pic .emoji { font-size: 66px; }
.setlist .vs { font-size: 28px; font-weight: 700; }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ---------- sorting hat ---------- */
.hat-wrap { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 6px; }
.hat-pic { width: min(60vw, 260px); height: min(60vw, 260px); }
.hat-pic .emoji { font-size: clamp(90px, 20vw, 170px); }
.bubble { background: #fff; border-radius: 28px; padding: 14px 26px; font-size: clamp(26px, 4.5vw, 44px); font-weight: 700; text-align: center;
  box-shadow: 0 6px 0 rgba(124,58,237,.18); max-width: 760px; width: 100%; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 860px; }
.opt { position: relative; background: #fff; border: 0; border-radius: 28px; padding: 14px 10px 16px; cursor: pointer; font: inherit; color: var(--ink);
  box-shadow: 0 7px 0 var(--purple), 0 12px 24px rgba(0,0,0,.1); transition: transform .1s; text-align: center; }
.opt:nth-child(2) { box-shadow: 0 7px 0 var(--teal), 0 12px 24px rgba(0,0,0,.1); }
.opt:nth-child(3) { box-shadow: 0 7px 0 var(--gold), 0 12px 24px rgba(0,0,0,.1); }
.opt:nth-child(4) { box-shadow: 0 7px 0 var(--pink), 0 12px 24px rgba(0,0,0,.1); }
.opt:hover { transform: translateY(-4px) scale(1.02); }
.opt:active { transform: translateY(4px); }
.opt .pic { width: 100%; height: 90px; }
.opt .pic .emoji { font-size: 64px; }
.opt .t { font-size: clamp(22px, 3.6vw, 34px); font-weight: 700; margin-top: 6px; }
.spk { position: absolute; top: 8px; right: 10px; font-size: 22px; background: #f1ecff; border: 0; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
.house-pic { width: min(70vw, 300px); height: min(70vw, 300px); }
.house-pic .emoji { font-size: clamp(110px, 24vw, 200px); }
.house-name { font-size: clamp(36px, 8vw, 70px); font-weight: 700; }
.bars { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.bar .lbl { width: 90px; text-align: right; font-weight: 600; }
.bar .fill { height: 22px; border-radius: 12px; min-width: 6px; transition: width .8s; }
.toggle { font-size: 16px; opacity: .8; display: flex; gap: 8px; align-items: center; }

/* ---------- potion maker ---------- */
.cauldron { position: relative; width: min(64vw, 270px); height: min(64vw, 270px); margin: 0 auto; }
.cauldron .pic { width: 100%; height: 100%; position: relative; z-index: 2; }
.cauldron .pic .emoji { font-size: clamp(120px, 26vw, 210px); }
.liquid { position: absolute; left: 24%; right: 24%; top: 30%; height: 20%; border-radius: 50%; background: #ddd; z-index: 3; opacity: .85; transition: background .5s; box-shadow: 0 0 20px rgba(255,255,255,.7) inset; }
.cauldron.bubble-anim { animation: munch .6s; }
.shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 860px; }
.item { background: #fff; border: 0; border-radius: 22px; padding: 8px 6px 10px; cursor: pointer; font: inherit; color: var(--ink); touch-action: none; user-select: none;
  box-shadow: 0 6px 0 rgba(124,58,237,.3), 0 10px 18px rgba(0,0,0,.08); text-align: center; }
.item:active { transform: translateY(3px); }
.item .pic { width: 100%; height: 70px; }
.item .pic .emoji { font-size: 48px; }
.item .w { font-size: clamp(20px, 3.4vw, 30px); font-weight: 700; }
.item.dragging { position: relative; z-index: 20; transition: none; }
.item.shake { animation: shake .4s; }
.item.used { opacity: .25; pointer-events: none; }
.step { background: #fff; border-radius: 24px; padding: 12px 26px; font-size: clamp(28px, 5vw, 46px); font-weight: 700; text-align: center;
  box-shadow: 0 6px 0 rgba(13,148,136,.25); }
.step mark { background: #ffe9a8; color: var(--ink); padding: 0 8px; border-radius: 10px; }
.bottle { font-size: clamp(90px, 18vw, 150px); }

</style>
</head>

<div class="topbar">
  <span></span>
  <label class="toggle"><input type="checkbox" id="auto" checked> Read aloud automatically</label>
</div>
<div id="app" class="hat-wrap"></div>

/* Shared helpers for Tamar's games */

/* Show an emoji until a real picture exists at `src`; then swap it in. */
function makePic(src, emoji, extraClass) {
  const box = document.createElement('div');
  box.className = 'pic' + (extraClass ? ' ' + extraClass : '');
  const em = document.createElement('span');
  em.className = 'emoji';
  em.textContent = emoji || '⭐';
  box.appendChild(em);
  if (src) {
    const img = new Image();
    img.alt = '';
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.src = (window.IMG && window.IMG[src]) || src; // if missing, onload never fires and the emoji stays
  }
  return box;
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }

function speakList(items) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    items.forEach(t => { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u); });
  } catch (e) {}
}

let _ac;
function tone(freq, start, dur, type, vol) {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = _ac.currentTime + start;
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(_ac.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  good() { tone(660, 0, .12, 'triangle'); tone(880, .1, .12, 'triangle'); tone(1175, .2, .22, 'triangle'); },
  bad() { tone(220, 0, .18, 'sawtooth', .08); tone(180, .15, .25, 'sawtooth', .08); },
  pick() { tone(520, 0, .1, 'triangle'); tone(780, .08, .14, 'triangle'); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .25, 'triangle')); }
};

function confetti(count) {
  let cv = document.getElementById('confetti');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv); }
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#7c3aed', '#0d9488', '#f5b301', '#ff7eb6', '#4cc9f0'];
  const bits = Array.from({ length: count || 90 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
    vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5,
    s: 6 + Math.random() * 8, c: colors[Math.floor(Math.random() * colors.length)],
    r: Math.random() * 6, vr: (Math.random() - .5) * .3
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    });
    if (++frames < 140) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

<script>
const app = document.getElementById('app');
const auto = document.getElementById('auto');
const D = window.SORTING;
let qi = 0, tally, picks;

function clear() { app.innerHTML = ''; app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade'); }
function hatPic(cls) { return makePic('assets/hat/hat.png', '🎩', 'hat-pic ' + (cls || '')); }
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }

function intro() {
  clear(); stopSpeech();
  app.appendChild(hatPic());
  app.appendChild(el('h1', '', 'The Sorting Hat'));
  app.appendChild(el('p', 'subhead', 'Welcome to ' + D.school + '! Which house is YOURS?'));
  const b = el('button', 'btn gold', '🎩 Put on the hat!');
  b.style.fontSize = '26px'; b.style.padding = '14px 34px';
  b.onclick = () => { qi = 0; tally = { H: 0, F: 0, W: 0, M: 0 }; picks = []; ask(); };
  app.appendChild(b);
}

function ask() {
  clear();
  const Q = D.questions[qi];
  const prog = el('div', 'progress');
  D.questions.forEach((_, i) => prog.appendChild(el('div', 'dot' + (i < qi ? ' done' : i === qi ? ' now' : ''))));
  app.appendChild(prog);
  const small = hatPic(); small.style.width = small.style.height = '110px'; small.querySelector('.emoji') && (small.querySelector('.emoji').style.fontSize = '80px');
  app.appendChild(small);
  app.appendChild(el('div', 'bubble', Q.q));
  const readAll = el('button', 'btn gold small', '🔊 Read it to me');
  const speakAll = () => speakList([Q.q].concat(Q.options.map(o => o.t)));
  readAll.onclick = speakAll;
  app.appendChild(readAll);
  const grid = el('div', 'opts');
  Q.options.forEach(o => {
    const b = el('button', 'opt');
    b.appendChild(makePic(o.img, o.e));
    b.appendChild(el('div', 't', o.t));
    const s = el('span', 'spk', '🔊'); s.setAttribute('role', 'button');
    s.onclick = ev => { ev.stopPropagation(); speak(o.t); };
    b.appendChild(s);
    b.onclick = () => { sfx.pick(); stopSpeech(); tally[o.h]++; picks.push(o.h); setTimeout(() => { qi++; qi >= D.questions.length ? reveal() : ask(); }, 300); };
    grid.appendChild(b);
  });
  app.appendChild(grid);
  if (auto.checked) setTimeout(speakAll, 350);
}

function reveal() {
  clear();
  app.appendChild(hatPic());
  app.appendChild(el('div', 'bubble', 'Hmm... let me think... 🤔'));
  speakList(['Hmm... let me think...']);
  setTimeout(() => {
    const max = Math.max(...Object.values(tally));
    const top = Object.keys(tally).filter(k => tally[k] === max);
    const h = D.houses[top[Math.floor(Math.random() * top.length)]];
    clear();
    app.appendChild(makePic(h.img, h.emoji, 'house-pic'));
    const n = el('div', 'house-name', h.name + '!'); n.style.color = h.color; app.appendChild(n);
    app.appendChild(el('div', 'bubble', h.text));
    const bars = el('div', 'bars');
    Object.keys(tally).forEach(k => {
      const r = el('div', 'bar'); r.appendChild(el('span', 'lbl', D.houses[k].short));
      const f = el('div', 'fill'); f.style.background = D.houses[k].color; f.style.width = '0%';
      r.appendChild(f); r.appendChild(el('span', '', String(tally[k]))); bars.appendChild(r);
      setTimeout(() => f.style.width = (tally[k] / D.questions.length * 100) + '%', 100);
    });
    app.appendChild(bars);
    const row = el('div'); row.style.display = 'flex'; row.style.gap = '14px';
    const r = el('button', 'btn', '↺ Sort me again'); r.onclick = intro;
    const sp = el('button', 'btn gold', '🔊 Read it'); sp.onclick = () => speakList([h.name, h.text]);
    row.append(r, sp); app.appendChild(row);
    sfx.win(); confetti(160); speakList([h.name + '!', h.text]);
  }, 2200);
}
intro();
</script>
</body>
</html>
