<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Sorter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

:root {
  --teal: #0d9488;
  --purple: #7c3aed;
  --gold: #f5b301;
  --pink: #ff7eb6;
  --ink: #2b2250;
  --bg1: #fff4fb;
  --bg2: #e8f7ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Fredoka', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px;
}
h1 { font-size: clamp(28px, 5vw, 48px); margin: 8px 0; text-align: center; }
h2 { font-size: clamp(22px, 3.5vw, 32px); margin: 6px 0; text-align: center; }
a { color: inherit; }

.topbar { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn {
  font: inherit; font-weight: 600; font-size: 18px; cursor: pointer;
  border: 0; border-radius: 999px; padding: 10px 22px;
  background: var(--purple); color: #fff;
  box-shadow: 0 5px 0 #4c1d95; transition: transform .08s, box-shadow .08s;
  text-decoration: none; display: inline-block;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4c1d95; }
.btn.teal { background: var(--teal); box-shadow: 0 5px 0 #0a6b63; }
.btn.teal:active { box-shadow: 0 1px 0 #0a6b63; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 #b88700; }
.btn.small { font-size: 15px; padding: 6px 16px; }

/* picture holder: shows an emoji until a real image is found */
.pic { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pic .emoji { line-height: 1; }

/* ---------- menu ---------- */
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; width: 100%; max-width: 900px; margin-top: 20px; }
.card {
  background: #fff; border-radius: 28px; padding: 22px; text-align: center;
  box-shadow: 0 8px 0 rgba(124,58,237,.18), 0 14px 30px rgba(0,0,0,.08);
  text-decoration: none; transition: transform .15s;
}
.card:hover { transform: translateY(-4px) rotate(-1deg); }
.card .pic { width: 150px; height: 150px; margin: 0 auto 10px; }
.card .pic .emoji { font-size: 90px; }
.card p { margin: 6px 0 0; font-size: 18px; opacity: .8; }
.subhead { text-align: center; font-size: 20px; opacity: .8; margin: 0; }

/* ---------- story picker ---------- */
.storylist { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 16px; width: 100%; max-width: 1000px; }
.storylist .card { width: 300px; }

/* ---------- adventure ---------- */
.stage { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 8px; }
.scene-pic {
  width: min(92vw, 52vh * 1.6, 640px); aspect-ratio: 16/10; background: #fff; border-radius: 32px;
  border: 6px solid #fff; box-shadow: 0 8px 0 rgba(13,148,136,.25), 0 14px 30px rgba(0,0,0,.1);
}
.scene-pic .emoji { font-size: clamp(80px, 18vw, 170px); letter-spacing: 8px; }
.scene-text {
  background: #fff; border-radius: 24px; padding: 16px 22px; max-width: 760px; width: 100%;
  font-size: clamp(18px, 2.2vw, 24px); line-height: 1.4; text-align: center;
  box-shadow: 0 5px 0 rgba(124,58,237,.15);
}
.choices { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: 100%; }
.choice {
  width: min(44vw, 300px); background: #fff; border: 0; border-radius: 30px; padding: 14px 10px 18px;
  cursor: pointer; font: inherit; color: var(--ink);
  box-shadow: 0 8px 0 var(--purple), 0 14px 26px rgba(0,0,0,.1);
  transition: transform .1s;
}
.choice:nth-child(2) { box-shadow: 0 8px 0 var(--teal), 0 14px 26px rgba(0,0,0,.1); }
.choice:hover { transform: translateY(-5px) scale(1.03); }
.choice:active { transform: translateY(5px); }
.choice .pic { width: 100%; aspect-ratio: 1; max-height: 220px; }
.choice .pic .emoji { font-size: clamp(60px, 11vw, 110px); }
.choice .word { font-size: clamp(34px, 6vw, 54px); font-weight: 700; letter-spacing: 3px; text-transform: lowercase; }
.the-end { font-size: clamp(30px, 6vw, 52px); font-weight: 700; color: var(--purple); }
.fade { animation: pop .45s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- sorter ---------- */
.board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px; }
.progress { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #d9d2f3; }
.dot.done { background: var(--teal); }
.dot.now { background: var(--gold); transform: scale(1.3); }
.buckets { display: flex; gap: 20px; width: 100%; justify-content: center; }
.bucket {
  flex: 1; max-width: 420px; background: #fff; border: 6px dashed #c9bdf0; border-radius: 34px;
  padding: 10px 10px 16px; text-align: center; cursor: pointer; font: inherit; color: var(--ink);
  transition: transform .12s, background .12s;
}
.bucket.a { border-color: #b7a1f5; }
.bucket.b { border-color: #7fd6cd; }
.bucket.hover { transform: scale(1.05); background: #fffbe0; }
.bucket .pic { width: min(36vw, 220px); height: min(36vw, 220px); margin: 0 auto; }
.bucket .pic .emoji { font-size: clamp(70px, 14vw, 130px); }
.bucket .label { font-size: clamp(32px, 6vw, 56px); font-weight: 700; }
.bucket .hint { font-size: 17px; opacity: .7; }
.bucket.munch { animation: munch .5s; }
@keyframes munch { 0%{transform:scale(1)} 30%{transform:scale(1.12,.9)} 60%{transform:scale(.95,1.08)} 100%{transform:scale(1)} }
.wordcard {
  touch-action: none; user-select: none; cursor: grab; position: relative; z-index: 10;
  background: #fff; border-radius: 28px; padding: 12px 36px 16px; text-align: center;
  box-shadow: 0 8px 0 var(--gold), 0 14px 26px rgba(0,0,0,.12);
}
.wordcard .pic { width: 120px; height: 120px; margin: 0 auto; }
.wordcard .pic .emoji { font-size: 70px; }
.wordcard .word { font-size: clamp(44px, 9vw, 84px); font-weight: 700; letter-spacing: 3px; }
.wordcard.dragging { cursor: grabbing; transition: none; box-shadow: 0 18px 30px rgba(0,0,0,.2); }
.wordcard.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(14px)} 60%{transform:translateX(-10px)} 80%{transform:translateX(10px)} }
.tip { font-size: 18px; opacity: .75; text-align: center; margin: 0; }
.stars { font-size: clamp(50px, 12vw, 100px); letter-spacing: 6px; }
.setlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; width: 100%; max-width: 900px; margin-top: 16px; }
.setlist .card { padding: 16px; }
.setlist .card .pic { width: 110px; height: 110px; }
.setlist .card .pic .emoji { font-size: 66px; }
.setlist .vs { font-size: 28px; font-weight: 700; }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

</style>
</head>
<body>
<div class="topbar">
  <span></span>
  <span id="crumb" class="subhead"></span>
  <a class="btn small teal" href="?">All sets</a>
</div>
<div id="app" class="board"></div>

/* Shared helpers for Tamar's games */

/* Show an emoji until a real picture exists at `src`; then swap it in. */
function makePic(src, emoji, extraClass) {
  const box = document.createElement('div');
  box.className = 'pic' + (extraClass ? ' ' + extraClass : '');
  const em = document.createElement('span');
  em.className = 'emoji';
  em.textContent = emoji || '⭐';
  box.appendChild(em);
  if (src) {
    const img = new Image();
    img.alt = '';
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.src = (window.IMG && window.IMG[src]) || src; // if missing, onload never fires and the emoji stays
  }
  return box;
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

let _ac;
function tone(freq, start, dur, type, vol) {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = _ac.currentTime + start;
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(_ac.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  good() { tone(660, 0, .12, 'triangle'); tone(880, .1, .12, 'triangle'); tone(1175, .2, .22, 'triangle'); },
  bad() { tone(220, 0, .18, 'sawtooth', .08); tone(180, .15, .25, 'sawtooth', .08); },
  pick() { tone(520, 0, .1, 'triangle'); tone(780, .08, .14, 'triangle'); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .25, 'triangle')); }
};

function confetti(count) {
  let cv = document.getElementById('confetti');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv); }
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#7c3aed', '#0d9488', '#f5b301', '#ff7eb6', '#4cc9f0'];
  const bits = Array.from({ length: count || 90 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
    vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5,
    s: 6 + Math.random() * 8, c: colors[Math.floor(Math.random() * colors.length)],
    r: Math.random() * 6, vr: (Math.random() - .5) * .3
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    });
    if (++frames < 140) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

  SORTERS.forEach(s => {
    const a = document.createElement('a'); a.className = 'card'; a.href = '?set=' + s.id;
    const row = document.createElement('div'); row.style.display = 'flex'; row.style.justifyContent = 'center'; row.style.alignItems = 'center'; row.style.gap = '6px';
    row.appendChild(makePic(s.a.img, s.a.emoji));
    const vs = document.createElement('span'); vs.className = 'vs'; vs.textContent = 'vs'; row.appendChild(vs);
    row.appendChild(makePic(s.b.img, s.b.emoji));
    a.appendChild(row);
    const t = document.createElement('h2'); t.textContent = s.title; a.appendChild(t);
    list.appendChild(a);
  });
  app.appendChild(list);
}

function play(set) {
  crumb.textContent = set.title;
  let queue = shuffle(set.words), idx = 0, mistakes = 0, busy = false;

  const prog = document.createElement('div'); prog.className = 'progress';
  const tip = document.createElement('p'); tip.className = 'tip'; tip.textContent = 'Drag the word to its monster — or tap the monster. Tap the word to hear it.';
  const cardHolder = document.createElement('div');
  const bk = document.createElement('div'); bk.className = 'buckets';

  function mkBucket(def, cls) {
    const b = document.createElement('button'); b.className = 'bucket ' + cls; b.dataset.side = cls;
    b.appendChild(makePic(def.img, def.emoji));
    const l = document.createElement('div'); l.className = 'label'; l.textContent = def.label; b.appendChild(l);
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = def.hint; b.appendChild(h);
    b.onclick = () => answer(cls);
    return b;
  }
  const bA = mkBucket(set.a, 'a'), bB = mkBucket(set.b, 'b');
  bk.appendChild(bA); bk.appendChild(bB);
  app.append(prog, cardHolder, tip, bk);

  function drawProg() {
    prog.innerHTML = '';
    queue.forEach((_, i) => { const d = document.createElement('div'); d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' now' : ''); prog.appendChild(d); });
  }

  let card;
  function next() {
    drawProg();
    cardHolder.innerHTML = '';
    if (idx >= queue.length) return finish();
    const item = queue[idx];
    card = document.createElement('div'); card.className = 'wordcard fade';
    card.appendChild(makePic('assets/words/' + item.w.toLowerCase() + '.png', ''));
    const pic = card.firstChild;
    pic.style.display = 'none';
    // show the picture holder only if a real image exists
    const probe = new Image(); probe.onload = () => { pic.innerHTML = ''; pic.appendChild(probe); pic.style.display = 'flex'; };
    probe.src = 'assets/words/' + item.w.toLowerCase() + '.png';
    const w = document.createElement('div'); w.className = 'word'; w.textContent = item.w; card.appendChild(w);
    cardHolder.appendChild(card);
    enableDrag(card, item);
    busy = false;
  }

  function answer(side) {
    if (busy) return;
    const item = queue[idx];
    if (item.s === side) {
      busy = true;
      sfx.good(); confetti(30);
      const b = side === 'a' ? bA : bB;
      b.classList.remove('munch'); void b.offsetWidth; b.classList.add('munch');
      card.style.transition = 'transform .3s, opacity .3s';
      card.style.transform = 'scale(.2)'; card.style.opacity = '0';
      idx++;
      setTimeout(next, 450);
    } else {
      mistakes++;
      sfx.bad();
      card.style.transform = '';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }

  function enableDrag(el, item) {
    let sx, sy, dragging = false, moved = false;
    el.addEventListener('pointerdown', e => {
      if (busy) return;
      sx = e.clientX; sy = e.clientY; dragging = true; moved = false;
      el.setPointerCapture(e.pointerId); el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 40}deg)`;
      [bA, bB].forEach(b => { const r = b.getBoundingClientRect(); b.classList.toggle('hover', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom); });
    });
    el.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false; el.classList.remove('dragging');
      [bA, bB].forEach(b => b.classList.remove('hover'));
      if (!moved) { el.style.transform = ''; speak(item.w); return; }
      let hit = null;
      [[bA, 'a'], [bB, 'b']].forEach(([b, s]) => { const r = b.getBoundingClientRect(); if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) hit = s; });
      if (hit) answer(hit);
      else { el.style.transition = 'transform .25s'; el.style.transform = ''; setTimeout(() => el.style.transition = '', 260); }
    });
  }

  function finish() {
    sfx.win(); confetti(160);
    app.innerHTML = '';
    const stars = mistakes === 0 ? 3 : mistakes <= 3 ? 2 : 1;
    const s = document.createElement('div'); s.className = 'stars'; s.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars); app.appendChild(s);
    const h = document.createElement('h1'); h.textContent = mistakes === 0 ? 'PERFECT!' : 'Great job!'; app.appendChild(h);
    const p = document.createElement('p'); p.className = 'subhead'; p.textContent = 'Oops count: ' + mistakes; app.appendChild(p);
    const r = document.createElement('button'); r.className = 'btn'; r.textContent = '↺ Play again';
    r.onclick = () => { app.innerHTML = ''; play(set); };
    const o = document.createElement('a'); o.className = 'btn teal'; o.href = 'sorter.html'; o.textContent = 'Pick another set';
    const row = document.createElement('div'); row.style.display = 'flex'; row.style.gap = '16px'; row.style.marginTop = '12px'; row.append(r, o);
    app.appendChild(row);
  }

  next();
}

const set = SORTERS.find(s => s.id === params.get('set'));
if (set) play(set); else menu();
</script>
