<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Big Interview</title><style>:root{--bg:#0a1730;--card:#10244a;--card2:#16305e;--gold:#e8b53a;--teal:#2bb8b0;--ink:#eef3fb;--ok:#3fcf7a;--bad:#ff6b5b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45}
.bg{min-height:100vh;background:#0a1730;background-size:cover;background-position:center;background-attachment:fixed;padding:16px}
.wrap{max-width:880px;margin:0 auto}
h1{color:#fff;margin:8px 0 2px;font-size:34px;text-align:center;letter-spacing:1px;text-transform:uppercase}
.sub{text-align:center;color:var(--gold);font-weight:600;margin-bottom:14px;letter-spacing:.5px}
h2,h3{color:var(--gold)}
.card{background:rgba(16,36,74,.94);border:2px solid var(--gold);border-radius:14px;padding:16px 20px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.row{display:flex;gap:18px;align-items:center}
.art{display:inline-flex;align-items:center;justify-content:center;font-size:74px;min-width:130px;height:150px}
.art.pic{height:auto;min-width:0}
.art img{display:block;width:190px;height:190px;object-fit:cover;object-position:top;border:3px solid var(--gold);border-radius:14px;background:#0a1730}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;font-weight:700;color:#fff;margin-bottom:4px}
.pill{background:rgba(10,23,48,.9);border:2px solid var(--teal);border-radius:999px;padding:3px 14px;font-size:16px}
.pill b{color:var(--gold);letter-spacing:2px}
button.choice,button.main{display:block;width:100%;text-align:left;font:inherit;border:2px solid var(--teal);background:rgba(22,48,94,.95);color:var(--ink);border-radius:10px;padding:12px 16px;margin:10px 0;cursor:pointer;transition:.12s}
button.choice:hover{border-color:var(--gold);background:#1d3d78;transform:translateY(-1px)}
button.main{background:var(--gold);color:#1a1200;border-color:#b98a14;text-align:center;font-weight:800;width:auto;display:inline-block;padding:11px 28px;letter-spacing:.5px}
button.choice.right{background:#12482d;border-color:var(--ok)}
button.choice.wrong{background:#561f1b;border-color:var(--bad)}
button.choice[disabled]{cursor:default;transform:none}
.fb{border-left:6px solid var(--gold);background:rgba(10,23,48,.95);padding:12px 16px;border-radius:8px;margin:12px 0}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.hl{background:var(--gold);color:#1a1200;border-radius:4px;padding:0 5px;font-weight:700}
input[type=text]{font:inherit;padding:11px 14px;border:2px solid var(--teal);border-radius:10px;width:100%;background:#0a1730;color:#fff}
.menu a{display:block;text-decoration:none;color:inherit}
.menu .card:hover{border-color:var(--teal);transform:translateY(-2px)}
.small{font-size:14px;color:#aebfd8}
a{color:var(--gold)}
ul.sum{padding-left:0;list-style:none}ul.sum li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.okm{color:var(--ok);font-weight:800}.badm{color:var(--bad);font-weight:800}
canvas{max-width:100%;border:3px solid var(--gold);border-radius:8px;background:#fff}
@media(max-width:600px){body{font-size:16px}.art{font-size:54px;min-width:90px;height:100px}.art img{width:110px;height:110px}.row{gap:12px}h1{font-size:26px}}
</style></head>

// Shared helpers. Art files go in /images; if a file is missing an emoji shows instead.
function loadImg(file,ok,fail){
  const base=file.replace(/\.(png|jpe?g|webp)$/i,'');const src=window.IMG&&window.IMG[base];
  if(!src){fail&&fail();return}
  const i=new Image();i.onload=()=>ok(i);i.onerror=()=>fail&&fail();i.src=src;
}
function art(file, emoji, cls){
  const w=document.createElement('span'); w.className='art '+(cls||''); w.textContent=emoji;
  loadImg(file,i=>{w.textContent='';w.classList.add('pic');i.alt='';w.appendChild(i)});return w;
}
function setBg(file){
  const el=document.querySelector('.bg'); if(!el) return;
  if(!file){el.style.backgroundImage='';return;}
  loadImg(file,i=>{el.style.backgroundImage='linear-gradient(rgba(6,14,32,.72),rgba(6,14,32,.82)),url('+i.src+')'});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s){return s.replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getName(){try{return localStorage.getItem('pname')||''}catch(e){return ''}}
function saveName(n){try{localStorage.setItem('pname',n)}catch(e){}}
</script>
<script>
// Each question: q = reporter question, a = options; first option in each list is the correct one (they get shuffled).
const ALL=[
{q:"Congratulations! Was the record doable?",a:["Yes, it was **doable**, but it was very hard.","Yes, it was **doeable**, but it was very hard.","Yes, it **doable**, but it was very hard."],why:"doable = do + able (drop the silent e). Every sentence needs a verb: it WAS doable."},
{q:"How did you measure your record?",a:["We **measured** the distance in meters.","We **measure** the distance in meters yesterday.","We was **measure** the distance in meters."],why:"Yesterday = past tense: measured."},
{q:"Who watched your attempt?",a:["My mom and my teacher **were** the witnesses.","My mom and my teacher **was** the witnesses.","My mom and my teacher witnesses **were**."],why:"Two people = were. And the word order is: subject + verb + the rest."},
{q:"Was it easier than you expected?",a:["No, it was **harder than** I expected.","No, it was **more hard then** I expected.","No, it was **hardest than** I expected."],why:"Short word: hard + er = harder. We say THAN (not then) to compare."},
{q:"Is your video good enough for the judges?",a:["Yes, everything is **visible** in the video.","Yes, everything is **visable** in the video.","Yes, everything **are visible** in the video."],why:"visible ends in -ible. Everything is singular, so we use is."},
{q:"What was the most incredible moment?",a:["The most **incredible** moment was the last second.","The most **incredable** moment was the last second.","The **incredible most** moment was the last second."],why:"incredible ends in -ible. The order is: the most + adjective + noun."},
{q:"Do you think someone can beat your record?",a:["Yes, I think someone **can break** it.","Yes, I think someone **can breaks** it.","Yes, I think someone **breakable** it."],why:"After can we use the base verb: can break. Breakable is an adjective, not a verb."},
{q:"Was your practice plan workable?",a:["Yes, it was workable. I **practiced** twenty minutes every day.","Yes, it was workable. I **practice** twenty minutes every day yesterday.","Yes, it was **worksable**. I practiced twenty minutes every day."],why:"work + able = workable. Past story = practiced."},
{q:"What is your advice for kids who want to try?",a:["I **advise them to start** small and practice every day.","I **advise them to starting** small and practice every day.","I **advise to them start** small and practice every day."],why:"advise + person + to + base verb: advise them to start."},
{q:"Is your record impossible to beat?",a:["No, it **isn't impossible**, but it is difficult.","No, it **isn't unpossible**, but it is difficult.","No, it **isn't imposible**, but it is difficult."],why:"The opposite of possible is impossible: im- + possible (two s's)."},
{q:"How did you feel at the end?",a:["I **was** very tired, but I **felt** incredible!","I **am** very tired, but I **felt** incredible yesterday!","I **was** very tired, but I **feel** incredible yesterday!"],why:"Keep the same time: was tired + felt incredible (both past)."},
{q:"Could you tell us about your equipment?",a:["I used a tape measure, and it was very **reliable**.","I used a tape measure, and it was very **reliabel**.","I used a tape measure, and it was very **relyable**."],why:"rely → y becomes i → reliable."}
];
const N=8, g=document.getElementById('game');
let qs,i,score,missed;
function start(){setBg('bg-stage.jpg');qs=shuffle(ALL).slice(0,N);i=0;score=0;missed=[];show()}
function mood(){return i===0?['reporter.png','🎙️']:['reporter.png','🎙️']}
function show(){
  if(i>=N) return end();
  const q=qs[i], opts=shuffle(q.a.map((t,k)=>({t,ok:k===0})));
  g.innerHTML='';
  const bar=document.createElement('div');bar.className='bar';
  bar.innerHTML=`<span class="pill">Question ${i+1} / ${N}</span><span class="pill">Score <b>${score}</b></span>`;g.appendChild(bar);
  const card=document.createElement('div');card.className='card';
  const row=document.createElement('div');row.className='row';
  row.appendChild(art('reporter.png','🎙️'));
  const t=document.createElement('div');t.innerHTML='<b>Reporter:</b><br>“'+esc(q.q)+'”<div class="small">Choose the best answer.</div>';row.appendChild(t);
  card.appendChild(row);g.appendChild(card);
  const box=document.createElement('div');g.appendChild(box);
  const fb=document.createElement('div');g.appendChild(fb);
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='choice';b.innerHTML=hl(esc(o.t).replace(/\*\*(.+?)\*\*/g,'**$1**'));
    b.onclick=()=>{
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      if(o.ok){b.classList.add('right');score++;fb.innerHTML='<div class="fb good"><span class="okm">✓ Great answer!</span><br>'+esc(q.why)+'</div>'}
      else{b.classList.add('wrong');missed.push({q:q.q,mine:o.t,right:q.a[0],why:q.why});
        box.querySelectorAll('button').forEach(x=>{if(x.dataset.ok)x.classList.add('right')});
        fb.innerHTML='<div class="fb bad"><span class="badm">✗ Not quite.</span> The best answer is the green one.<br>'+esc(q.why)+'</div>'}
      const n=document.createElement('button');n.className='main';n.textContent=i+1<N?'Next question →':'See my result';
      n.onclick=()=>{i++;show()};fb.appendChild(n);
    };
    if(o.ok)b.dataset.ok=1;
    box.appendChild(b);
  });
}
function end(){
  const pct=score/N, rank=pct===1?['🏆','Superstar! The reporter wants a second interview!']:pct>=.75?['🌟','Great interview! You will be on the news tonight!']:pct>=.5?['📰','Good interview. A few answers need practice.']:['🎤','Nice try! Practice and interview again.'];
  g.innerHTML='';
  const c=document.createElement('div');c.className='card';c.style.textAlign='center';
  const a=art(pct>=.75?'reporter-happy.png':'reporter.png',rank[0]);a.style.height='auto';c.appendChild(a);
  c.insertAdjacentHTML('beforeend',`<h2>${score} / ${N} correct</h2><p>${rank[1]}</p>`);g.appendChild(c);
  if(missed.length){
    const m=document.createElement('div');m.className='card';m.innerHTML='<h3>Let\'s fix these:</h3><ul class="sum">'+missed.map(x=>`<li><div class="small">${esc(x.q)}</div><span class="badm">✗</span> ${hl(esc(x.mine))}<br><span class="okm">✓</span> ${hl(esc(x.right))}<br><i>${esc(x.why)}</i></li>`).join('')+'</ul>';g.appendChild(m)
  }
  const b=document.createElement('button');b.className='main';b.textContent='Play again';b.onclick=start;g.appendChild(b);
}
start();
</script></body></html>
